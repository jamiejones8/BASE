name: Publish R dependency image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.dependencies
      - .github/workflows/publish-dependency-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: base-r-dependency-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dependency image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dependencies
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jamiejones8/base-r-dependencies:r4.4.2-v1
            ghcr.io/jamiejones8/base-r-dependencies:latest
          cache-from: type=gha,scope=base-r-dependencies
          cache-to: type=gha,mode=max,scope=base-r-dependencies
